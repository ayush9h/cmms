services:
  - type: web
    name: omr-cmms-api
    runtime: python
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m scripts.seed && uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: UVICORN_HOST
        value: 0.0.0.0
      - key: UVICORN_PORT
        value: "10000"
      - key: DB_POSTGRES_URL
        sync: false
      - key: CMMS_SECRET
        generateValue: true
      - key: CMMS_COOKIE_SECURE
        value: "1"
