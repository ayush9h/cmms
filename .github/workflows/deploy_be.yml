name: Deploy backend service to Render

on:
  push:
    branches:
      - main
    paths:
      - "server/**"
  workflow_dispatch:

jobs:
  run_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create virtual environment
        working-directory: server
        run: uv venv

      - name: Install Dependencies
        working-directory: server
        run: uv pip install -r requirements.txt

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Render BE Deployment
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"