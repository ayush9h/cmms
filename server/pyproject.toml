[project]
name = "cmms-server"
version = "0.1.0"
description = "Customizable dashboard system for manufacturing plants."
readme = "README.md"
authors = [
    { name = "Ayush Kumar", email = "ayush.kumar.21cse@bmu.edu.in" }
]
# numpy 2.5 and pandas 3.1 need >=3.12; the container image is 3.13-slim.
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.1",
    "annotated-doc==0.0.6",
    "annotated-types==0.8.0",
    "anyio==4.16.0",
    "asyncpg==0.32.0",
    "click==8.5.1",
    "et-xmlfile==2.0.0",
    "fastapi==0.162.4",
    "greenlet==3.5.6",
    "h11==0.16.0",
    "httptools==0.9.0",
    "idna==3.20",
    "lxml==6.1.3",
    "mako==1.4.3",
    "markupsafe==3.0.4",
    "numpy==2.5.4",
    "openpyxl==3.1.5",
    "opentelemetry-api==1.45.2",
    "pandas==3.1.1",
    "pillow==13.0.0",
    "pydantic==2.14.3",
    "pydantic-core==2.50.4",
    "pydantic-settings>=2.16.2",
    "pyjwt==2.15.1",
    "python-dateutil==4.0.0",
    "python-dotenv==1.2.4",
    "python-pptx==1.0.2",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]==2.1.8",
    "sqlmodel==0.0.49",
    "starlette==1.10.0",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.5",
    "tzdata==2026.6",
    "uvicorn[standard]==0.54.0",
    "uvloop==0.23.0 ; platform_python_implementation != 'PyPy' and sys_platform != 'cygwin' and sys_platform != 'win32'",
    "watchfiles==1.3.0",
    "websockets==17.4",
    "xlsxwriter==3.3.1",
]

[tool.uv]
package = false
